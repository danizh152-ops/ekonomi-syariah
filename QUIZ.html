<body>

    <header class="navbar">
        <img src="EKSYAH-LOGO.png" alt="logo-eksyah" class="logo-ngiri">
        <h2 class="headline" style="text-decoration: none;">EKSYAH.ID</h2>
        <div>

            <img src="smaridasa.png" alt="SMAN 10 Samarinda" class="logo-tengah">
            <img src="logosugt.png" alt="SUGT" class="logo">
        </div>
    </header>

    <div class="quiz-container">
        <!-- Area Soal -->
        <div id="quiz-box">
            <h2 id="question">Pertanyaan akan muncul di sini...</h2>
            <div id="options" class="options-container">
                <!-- Pilihan jawaban  -->
            </div>
            <div>
                <button id="back-btn" onclick="konfirmasiKembali()">Kembali</button>
                <button id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
            </div>
        </div>

        <!-- Area Hasil (Sembunyi secara default) -->
        <div id="result-box" style="display: none;">
            <h2 style="text-align: center;">Kuis Selesai</h2>
            <p id="score-text" style="text-align: center;">Skor kamu akan muncul di sini</p>
            <div style="text-align: center; margin-top: 20px;">
                <button onclick="restartQuiz()">Ulangi Kuis</button>
                <button onclick="window.location.href='index.html'">Kembali ke Home</button>
            </div>
        </div>

        <script>
            const quizData = [
                {
                    question: "1. Apa prinsip utama dalam Ekonomi Syariah?",
                    options: ["Riba", "Gharar", "Keadilan & Maslahat", "Maysir"],
                    answer: 2
                },
                {
                    question: "2. Zakat harta (maal) wajib dikeluarkan jika sudah mencapai...",
                    options: ["Nisab dan Haul", "Hitungan Bulanan", "Batas Bebas Tax", "Syarat Biasa"],
                    answer: 0
                },
                {
                    question: "3. Ilmu ekonomi syariah didasarkan pada...",
                    options: ["Al-Qur'an", "Hadits", "Ijma' dan Qiyas", "Benar Semua"],
                    answer: 3
                },
                {
                    question: "4. Istilah untuk perolehan keuntungan secara spekulatif tanpa usaha produktif adalah...",
                    options: ["Riba", "Gharar", "Haram", "Maysir"],
                    answer: 0
                },
                {
                    question: "5. Makna haram adalah...",
                    options: ["Diperbolehkan", "Dilarang", "Dianjurkan", "Sebaiknya Ditinggalkan"],
                    answer: 1
                },

            ];

            let currentQuestion = 0;
            let score = 0;
            let selectedOption = null;

            // Fungsi menampilkan soal & pilihan
            function loadQuestion() {
                selectedOption = null;
                const q = quizData[currentQuestion];
                document.getElementById("question").innerText = q.question;

                const optionsContainer = document.getElementById("options");
                optionsContainer.innerHTML = "";

                q.options.forEach((opt, index) => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerText = opt;
                    btn.onclick = () => selectOption(btn, index);
                    optionsContainer.appendChild(btn);
                });
            }

            // Fungsi menandai pilihan yang diklik user
            function selectOption(btn, index) {
                document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
                btn.classList.add("selected");
                selectedOption = index;
            }

            // Fungsi pindah ke soal berikutnya
            function nextQuestion() {
                if (selectedOption === null) {
                    alert("Pilih salah satu jawaban terlebih dahulu!");
                    return;
                }

                // Tambah skor jika jawaban benar
                if (selectedOption === quizData[currentQuestion].answer) {
                    score++;
                }

                currentQuestion++;

                if (currentQuestion < quizData.length) {
                    loadQuestion();
                } else {
                    showResult();
                }
            }

            // Fungsi menampilkan hasil akhir
            function showResult() {
                document.getElementById("quiz-box").style.display = "none";
                document.getElementById("result-box").style.display = "block";
                document.getElementById("score-text").innerText =
                    `Skor Kamu: ${score} dari ${quizData.length} Soal!`;
            }

            // Fungsi restart kuis
            function restartQuiz() {
                currentQuestion = 0;
                score = 0;
                document.getElementById("quiz-box").style.display = "block";
                document.getElementById("result-box").style.display = "none";
                loadQuestion();
            }

            // Jalankan kuis pertama kali saat halaman dimuat
            loadQuestion();

            function konfirmasiKembali() {
                document.getElementById('modal-konfirmasi').classList.add('show');
            }

            document.addEventListener("DOMContentLoaded", function () {
                // ... kode DOMContentLoaded kamu yang sudah ada ...

                // Event listener tombol modal
                const btnYa = document.getElementById('btn-ya');
                const btnBatal = document.getElementById('btn-batal');
                const modal = document.getElementById('modal-konfirmasi');

                if (btnYa) {
                    btnYa.addEventListener('click', function () {
                        window.location.href = 'index.html';
                    });
                }

                if (btnBatal) {
                    btnBatal.addEventListener('click', function () {
                        modal.classList.remove('show');
                    });
                }

                // Tutup modal kalau klik di luar kotak
                if (modal) {
                    modal.addEventListener('click', function (e) {
                        if (e.target === modal) {
                            modal.classList.remove('show');
                        }
                    });
                }
            });

        </script>

    </div>
    <div id="modal-konfirmasi" class="modal-overlay">
        <div class="modal-box">
            <span class="material-symbols-outlined modal-icon">warning</span>
            <p>Apakah kamu yakin ingin kembali?<br>Progres kuis akan hilang.</p>
            <div class="modal-buttons">
                <button id="btn-ya" class="btn-ya">Ya, Kembali</button>
                <button id="btn-batal" class="btn-batal">Batal</button>
            </div>
        </div>
    </div>
</body>
